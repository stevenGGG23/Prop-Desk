<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- White/light background -->
  <rect width="100" height="100" rx="16" fill="#f0f4ff"/>
  <!-- Bar chart icon - blue bars (My Funded Futures) -->
  <!-- Bar 1 (shortest, left) -->
  <rect x="12" y="62" width="16" height="26" rx="3" fill="#2563eb"/>
  <!-- Bar 2 (medium) -->
  <rect x="33" y="48" width="16" height="40" rx="3" fill="#2563eb"/>
  <!-- Bar 3 (tall) -->
  <rect x="54" y="32" width="16" height="56" rx="3" fill="#f97316"/>
  <!-- Bar 4 (tallest, right) -->
  <rect x="75" y="18" width="16" height="70" rx="3" fill="#2563eb"/>
  <!-- X axis line -->
  <line x1="8" y1="90" x2="92" y2="90" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
</svg>
