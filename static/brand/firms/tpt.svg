<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Take Profit Trader">
  <!-- Black background -->
  <rect width="100" height="100" rx="16" fill="#0d0d0d"/>
  <!-- Candlestick chart icon -->
  <!-- Candle 1 (green/up) -->
  <line x1="20" y1="28" x2="20" y2="22" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <rect x="15" y="35" width="10" height="20" rx="1.5" fill="#ef4444"/>
  <line x1="20" y1="55" x2="20" y2="62" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Candle 2 (red/down) -->
  <line x1="38" y1="18" x2="38" y2="12" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <rect x="33" y="18" width="10" height="28" rx="1.5" fill="#f97316"/>
  <line x1="38" y1="46" x2="38" y2="55" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>

  <!-- Candle 3 (up, red/orange) -->
  <line x1="56" y1="30" x2="56" y2="24" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>
  <rect x="51" y="30" width="10" height="22" rx="1.5" fill="#ef4444"/>
  <line x1="56" y1="52" x2="56" y2="60" stroke="#ef4444" stroke-width="2" stroke-linecap="round"/>

  <!-- Candle 4 (bullish, taller orange) -->
  <line x1="74" y1="20" x2="74" y2="14" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>
  <rect x="69" y="20" width="10" height="32" rx="1.5" fill="#f97316"/>
  <line x1="74" y1="52" x2="74" y2="62" stroke="#f97316" stroke-width="2" stroke-linecap="round"/>

  <!-- Horizontal base line -->
  <line x1="10" y1="76" x2="90" y2="76" stroke="#444444" stroke-width="1.5" stroke-linecap="round"/>

  <!-- "TPT" text hint - small text -->
  <text x="50" y="90" font-family="Arial,sans-serif" font-size="11" font-weight="bold"
        fill="#ef4444" text-anchor="middle" letter-spacing="2">TPT</text>
</svg>
