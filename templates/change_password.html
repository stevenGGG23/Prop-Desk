{% extends "base.html" %}
{% block title %}Change Password — Prop Desk{% endblock %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Set new password</h1>
  <p class="page-sub">Your account uses a temporary password. Set a permanent one to continue.</p>
</div>

<div class="form-card" style="max-width:400px;">
  <form method="POST">
    <div class="field">
      <label class="label" for="current_password">Current password</label>
      <input class="input" type="password" id="current_password" name="current_password" required>
    </div>
    <div class="field">
      <label class="label" for="new_password">New password</label>
      <input class="input" type="password" id="new_password" name="new_password"
             minlength="8" required>
    </div>
    <div class="field">
      <label class="label" for="confirm_password">Confirm new password</label>
      <input class="input" type="password" id="confirm_password" name="confirm_password" required>
    </div>
    <button type="submit" class="btn btn--primary">Update password</button>
  </form>
</div>
{% endblock %}
